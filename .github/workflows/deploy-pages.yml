name: Deploy HTMLMemo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run test:browser
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish HTMLMemo
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Wait for the published app and verify the sidebar in Chrome
        env:
          HTMLMEMO_SIDEBAR_TEST_URL: https://seionwon.github.io/HTMLMemo/
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const expected=await readFile('public/src/app.js','utf8');
          const url=new URL('src/app.js',process.env.HTMLMEMO_SIDEBAR_TEST_URL);
          url.searchParams.set('verify',process.env.GITHUB_SHA);
          let matched=false;
          for(let attempt=0;attempt<30;attempt++){
            const response=await fetch(url,{cache:'no-store'});
            if(response.ok&&await response.text()===expected){matched=true;break;}
            await new Promise(resolve=>setTimeout(resolve,2000));
          }
          if(!matched)throw new Error('Published app.js does not match the deployed commit.');
          console.log('Published app.js matches this commit.');
          NODE
          node --test --test-name-pattern='sidebar view choices' tests/browser.integration.mjs
      - name: Keep published desktop and mobile verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-sidebar-screenshots
          path: test-results/sidebar-views-*.png
          if-no-files-found: ignore
