name: Deploy HTMLMemo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: mkdir -p test-results
      - run: npm run test:browser
      - name: Keep structured Chrome results and fixture screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            test-results/browser-results.xml
            test-results/*.png
          if-no-files-found: ignore
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish HTMLMemo
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify the published URL-only app, sidebar, annotation tree and pen scaling in Chrome
        env:
          HTMLMEMO_SIDEBAR_TEST_URL: https://seionwon.github.io/HTMLMemo/
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const files=['index.html','src/app.js','src/utils.js','src/web.js','src/reader.js','src/model.js','src/local-files.js','src/storage.js','styles.css'];
          const expected=await Promise.all(files.map(file=>readFile('public/'+file,'utf8')));
          let matched=false;
          for(let attempt=0;attempt<30;attempt++){
            const matches=await Promise.all(files.map(async(file,i)=>{
              const url=new URL(file,process.env.HTMLMEMO_SIDEBAR_TEST_URL);
              url.searchParams.set('verify',process.env.GITHUB_SHA);
              const response=await fetch(url,{cache:'no-store'});
              return response.ok&&await response.text()===expected[i];
            }));
            if(matches.every(Boolean)){matched=true;break;}
            await new Promise(resolve=>setTimeout(resolve,2000));
          }
          if(!matched)throw new Error('Published reader files do not match the deployed commit.');
          console.log('Published app, reader and model match this commit.');
          NODE
          mkdir -p test-results
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results/published-browser-results.xml --test-name-pattern='whole-book search|duplicate HTML import|reading controls|palette controls|toolbar mode groups|sidebar view choices|annotation tree|font-scaled pen|Pages-only|Chrome companion' tests/browser.integration.mjs
      - name: Keep published desktop and mobile verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-sidebar-screenshots
          path: |
            test-results/published-browser-results.xml
            test-results/palette-controls-*.png
            test-results/palette-drag-*.png
            test-results/toolbar-modes-*.png
            test-results/reading-controls-*.png
            test-results/duplicate-import-*.png
            test-results/sidebar-views-*.png
            test-results/book-search-*.png
            test-results/font-scaled-pen-*.png
            test-results/annotation-tree-*.png
            test-results/pages-only-*.png
            test-results/chrome-companion-*.png
          if-no-files-found: ignore
