name: Deploy HTMLMemo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Install Korean fonts for realistic mobile layout checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - run: npm test
      - run: npm run check
      - run: mkdir -p test-results
      - name: Verify startup ordering and restart safety with the expanded offline assets
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results/browser-results.xml --test-name-pattern='PWA startup updates run before folder permissions' tests/browser-updates.integration.mjs
      - name: Verify unified PDF reading, annotations, export, safety and offline use first
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results/browser-results.xml tests/browser-pdf.integration.mjs
      - name: Verify Markdown paste, precise bookmarks and compact library first
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results/browser-results.xml --test-name-pattern='Pages-only pasted reading controls|Pages-only Markdown paste|Pages-only precise bookmarks|Pages-only bookmark tree|compact library' tests/browser.integration.mjs
      - name: Verify folder startup, small phone layouts and touch scrolling first
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results/browser-results.xml --test-name-pattern='Pages-only empty library|Pages-only low-resolution' tests/browser-mobile.integration.mjs
      - name: Verify popover, help and update regressions
        run: node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results/browser-results.xml --test-name-pattern='palette controls|Pages-only circles and ellipses|toolbar mode groups|Pages-only URL use|Pages-only searchable help|PWA startup updates' tests/browser.integration.mjs tests/browser-help.integration.mjs tests/browser-updates.integration.mjs
      - name: Verify source navigation, library trash and folder startup before the full Chrome suite
        run: node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results/browser-results.xml --test-name-pattern='Pages-only annotations and bookmarks move to a new edition|Pages-only history stays with the selected document|Pages-only body links and previous-next|Pages-only first-run folder welcome|Pages-only script-driven TOC|Pages-only library trash|native sidebar view choices are visible|sidebar view choices preserve search drafts|Android saved folder|Pages-only two-finger scrolling|Pages-only touch and pen text marking|device sync connection recovery|device sync entry|device sync settings choices|device sync streams a|device sync exchanges live documents|device sync annotation choices' tests/browser.integration.mjs tests/browser-library-folders.integration.mjs tests/browser-mobile.integration.mjs tests/browser-updates.integration.mjs tests/browser-device-sync.integration.mjs
      - run: npm run test:browser
      - name: Keep structured Chrome results and fixture screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            test-results/browser-results.xml
            test-results/device-sync*.json
            test-results/duplicate-import-performance.json
            test-results/mhtml-import-diagnostics.json
            test-results/search-index-performance.json
            test-results/tab-sizing-metrics.json
            test-results/tab-sizing-failure.json
            test-results/tts-resume-*.json
            test-results/tts-controls-*.json
            test-results/tts-selection-*.json
            test-results/sidebar-views-collapse-*.json
            test-results/toolbar-modes-selection-note-*.json
            test-results/pages-only-*.json
            test-results/pwa-startup-*.json
            test-results/*.png
          if-no-files-found: ignore
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish HTMLMemo
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Korean fonts for realistic mobile layout checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Verify the published URL-only app, sidebar, annotation tree and pen scaling in Chrome
        env:
          HTMLMEMO_SIDEBAR_TEST_URL: https://seionwon.github.io/HTMLMemo/
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {PDF_ASSETS} from './public/src/pdf/assets.js';
          const files=['index.html','src/app.js','src/updates.js','src/help.js','src/help-content.js','src/utils.js','src/preferences.js','src/web.js','src/markdown.js','vendor/markdown-it.js','vendor/markdown-it-LICENSE.txt','src/reader.js','src/isolated-runtime.js','src/read-aloud.js','src/search-index.js','src/model.js','src/document.js','src/bookmark-location.js','src/migrate.js','src/local-files.js','src/mhtml.js','src/storage.js','src/data-folder.js','src/library-folders.js','src/folder-tree.js','manifest.webmanifest','styles.css','src/sync-service.js','src/sync-crypto.js','src/sync-adapter.js','src/sync-ui.js','src/sync-device-service.js','src/sync-peer.js','src/sync-stream.js','src/sync-temp.js','src/sync-qr.js','vendor/html5-qrcode.min.js','vendor/html5-qrcode-LICENSE.txt','vendor/qrcodegen-LICENSE.txt','src/pdf-document.js','src/pdf-reader.js','src/pdf/assets.js','src/pdf/text-search.js','src/pdf/embedded-search-index.js','src/pdf/page-rendering.js','src/pdf/search-cache.js','src/pdf/viewport-window.js',...PDF_ASSETS];
          const expected=await Promise.all(files.map(file=>readFile('public/'+file)));
          let matched=false;
          for(let attempt=0;attempt<30;attempt++){
            const matches=await Promise.all(files.map(async(file,i)=>{
              const url=new URL(file,process.env.HTMLMEMO_SIDEBAR_TEST_URL);
              url.searchParams.set('verify',process.env.GITHUB_SHA);
              const response=await fetch(url,{cache:'no-store'});
              return response.ok&&Buffer.from(await response.arrayBuffer()).equals(expected[i]);
            }));
            if(matches.every(Boolean)){matched=true;break;}
            await new Promise(resolve=>setTimeout(resolve,2000));
          }
          if(!matched)throw new Error('Published reader files do not match the deployed commit.');
          console.log('Published app, reader and model match this commit.');
          NODE
          mkdir -p test-results
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results/published-browser-results.xml --test-name-pattern='MHTML import|compact library|folder setup|whole-book search|long-document search|duplicate HTML import|reading controls|palette controls|toolbar mode groups|sidebar view choices|annotation tree|font-scaled pen|Pages-only|Chrome companion|adaptive file tabs|TTS paused resume|TTS transport controls|TTS selection|device sync entry' tests/browser-pdf.integration.mjs tests/browser.integration.mjs tests/browser-library-folders.integration.mjs tests/browser-annotation-jump.integration.mjs tests/browser-security.integration.mjs tests/browser-annotation-picking.integration.mjs tests/browser-device-sync.integration.mjs tests/browser-mobile.integration.mjs tests/browser-help.integration.mjs tests/browser-updates.integration.mjs
      - name: Keep published desktop and mobile verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-sidebar-screenshots
          path: |
            test-results/published-browser-results.xml
            test-results/device-sync*.png
            test-results/duplicate-import-performance.json
            test-results/mhtml-import-diagnostics.json
            test-results/search-index-performance.json
            test-results/tab-sizing-metrics.json
            test-results/tab-sizing-failure.json
            test-results/tts-resume-*.json
            test-results/tts-resume-*.png
            test-results/tts-controls-*.json
            test-results/tts-controls-*.png
            test-results/tts-selection-*.json
            test-results/tts-selection-*.png
            test-results/tab-sizing-*.png
            test-results/search-index-*.png
            test-results/mhtml-import-*.png
            test-results/library-compact-*.png
            test-results/folder-setup-*.png
            test-results/palette-controls-*.png
            test-results/palette-drag-*.png
            test-results/toolbar-modes-*.png
            test-results/toolbar-modes-selection-note-*.json
            test-results/reading-controls-*.png
            test-results/duplicate-import-*.png
            test-results/sidebar-views-*.png
            test-results/sidebar-views-collapse-*.json
            test-results/book-search-*.png
            test-results/font-scaled-pen-*.png
            test-results/annotation-tree-*.png
            test-results/pages-only-*.png
            test-results/pages-only-*.json
            test-results/chrome-companion-*.png
          if-no-files-found: ignore
