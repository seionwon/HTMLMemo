2" y="479" font-size="15" font-weight="400" fill="#303844">기록은 기억의 빈틈을 채우는 작은 습관이다.</text><text x="712" y="516" font-size="15" font-weight="400" fill="#303844">중요한 문장에 밑줄을 긋고, 내 생각을 곁에 남긴다.</text><text x="712" y="548" font-size="15" font-weight="400" fill="#303844">다시 펼쳐 볼 때, 그날의 질문이 새로운 생각이 된다.</text><rect x="712" y="570" width="354" height="2" rx="1.0" fill="#9aabb3" stroke="none"/><rect x="1179" y="592" width="165" height="66" rx="8" fill="#fff6d8" stroke="#e7cf91"/><text x="1193" y="616" font-size="12" font-weight="500" fill="#675627">다시 읽을 때 연결하기</text><text x="1193" y="639" font-size="11" font-weight="400" fill="#77683f">내 생각도 함께 남겨 두자.</text><text x="712" y="619" font-size="13" font-weight="400" fill="#737c89">작은 표시 하나가 다음 읽기의 출발점이 된다.</text><rect x="856.5" y="696" width="342" height="48" rx="13" fill="#232a36" stroke="#384354"/><g transform="translate(872.5 709) scale(0.875)"><path d="M5 3v17l5-5 4 7 3-2-4-7h7z" fill="none" stroke="#e6ebf3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="905.5" y="703" width="33" height="33" rx="7" fill="#334a69" stroke="none"/><g transform="translate(911.5 709) scale(0.875)"><path d="m5 12 9-9 7 7-9 9-7-7M5 16l3 3-3 3H2z" fill="none" stroke="#94bbf4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(950.5 709) scale(0.875)"><path d="M6 3v9a6 6 0 0 0 12 0V3M4 22h16" fill="none" stroke="#e6ebf3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(989.5 709) scale(0.875)"><path d="m5 16 11-11 4 4L9 20H5zM14 7l4 4" fill="none" stroke="#e6ebf3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(1028.5 709) scale(0.875)"><path d="M4 3h16v13l-5 5H4zM15 21v-6h5" fill="none" stroke="#e6ebf3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(1067.5 709) scale(0.875)"><path d="M4 4h16v16H4z" fill="none" stroke="#e6ebf3" stroke-wi