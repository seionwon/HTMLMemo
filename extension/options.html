<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>HTMLMemo 연결 설정</title><link rel="stylesheet" href="extension.css"><script type="module" src="options.js"></script></head><body class="options"><div class="brand"><span>H</span><strong>HTMLMemo</strong></div><h1>HTMLMemo 연결 설정</h1><p>기본 연결 주소는 seionwon/HTMLMemo의 PWA입니다.<br>문서와 주석은 웹 서버가 아니라 이 기기에 저장합니다.</p><button class="primary" id="default-app">HTMLMemo PWA에 연결</button><details><summary>로컬 HTML 파일에 연결하기</summary><form id="form"><label for="pwa-url">HTMLMemo 주소</label><input id="pwa-url" type="url" required><button class="primary" type="submit">주소 저장</button></form><p class="small">로컬 HTML에 연결할 때는 확장 기능의 세부정보에서 「파일 URL에 대한 액세스 허용」을 켜주세요.</p></details><div id="status" role="status"></div><p class="small">웹 페이지를 저장하기 위해 사이트 읽기 및 리소스 접근 권한을 사용합니다.<br>저장 버튼을 누르기 전에는 페이지 내용을 수집하지 않습니다.<br>문서·주석·설정은 이 기기에만 저장합니다.</p></body></html>
