<!doctype html><html lang="ko" data-theme="light"><head><meta charset="utf-8"><title>읽기 도구 모양 비교</title><style>
/* Public reader-head UI only; book content and embedded runtimes are omitted. */
:root{color-scheme:light;--paper:#fff;--panel:#f6f8fa;--ink:#1f2328;--muted:#57606a;--line:#e5e7eb}
:root[data-theme=dark]{color-scheme:dark;--paper:#14161b;--panel:#1b1e25;--ink:#e8eaf0;--muted:#a5adbc;--line:#383e4a}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:'Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,'Noto Sans KR','Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink)}
body{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button,input,select{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:.4rem}button,select{min-height:2rem}button{cursor:pointer;padding:.3rem .6rem}button:disabled{opacity:.4;cursor:default}
.reader-head{display:flex;align-items:center;flex-wrap:wrap;gap:.3rem;padding:.35rem .6rem;border-bottom:1px solid var(--line);background:var(--panel);z-index:4}.reader-head button{flex-shrink:0}.reader-head select{max-width:6rem;font-size:.85rem}
.reader-title{flex:1;min-width:5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem;font-weight:650}.reader-position{font-size:.78rem;color:var(--muted);white-space:nowrap}
.reader-layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:0}nav,main{overflow:auto;padding:24px}nav a{display:block}
@media(min-width:761px){#reader-menu{display:none}}
@media(max-width:760px){.reader-head{gap:.2rem;padding:.3rem}.reader-head button{padding:.3rem .45rem}.reader-title{min-width:3rem;font-size:.85rem}.reader-position{display:none}}
</style></head><body><header class="reader-head"><button id="reader-menu" type="button" title="목차" aria-label="목차" aria-controls="reader-nav" aria-expanded="false">☰</button><span class="reader-title" title="붙여넣기 읽기 도구">붙여넣기 읽기 도구</span><button id="reader-back" type="button" title="뒤로" aria-label="뒤로" disabled>↶</button><button id="reader-previous" type="button" title="이전 절" aria-label="이전 절" disabled>‹</button><button id="reader-next" type="button" title="다음 절" aria-label="다음 절">›</button><span class="reader-position" id="reader-position">1 / 3</span><button id="reader-smaller" type="button" title="글씨 작게" aria-label="글씨 작게">A−</button><button id="reader-larger" type="button" title="글씨 크게" aria-label="글씨 크게">A+</button><select id="reader-theme" aria-label="화면 모드"><option value="system">시스템</option><option value="light">밝게</option><option value="dark">어둡게</option></select></header><div class="reader-layout"><nav id="reader-nav"><h2>목차</h2><a href="#first">첫째 제목</a><a href="#second">둘째 제목</a><a href="#last">마지막 제목</a></nav><main><h1 id="first">첫째 제목</h1><p>화면과 버튼 모양만 비교하는 합성 문서입니다.</p><h2 id="second">둘째 제목</h2><h2 id="last">마지막 제목</h2></main></div></body></html>
